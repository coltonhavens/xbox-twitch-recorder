name: Test Drive fallback fetch
on:
  push:
    branches: [clipper]
    paths: ['.github/workflows/drive-fetch-test.yml']
  workflow_dispatch:
    inputs:
      vod: {description: "VOD id", required: true, default: "2931992210"}
      start: {description: "start s", required: true, default: "1997"}
      end: {description: "end s", required: true, default: "2005"}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: clipper}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --no-cache-dir -r clipper/requirements.txt
      - name: Fetch a window (Twitch, else Drive). Nothing is uploaded.
        env:
          XTR_DRIVE_AUTH: ${{ secrets.XTR_DRIVE_AUTH }}
          VOD: ${{ inputs.vod || '2931992210' }}
          A: ${{ inputs.start || '1997' }}
          B: ${{ inputs.end || '2005' }}
        run: |
          python clipper/twitch_fetch.py window "$VOD" "$A" "$B" /tmp/w.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/w.mp4
          ffmpeg -v error -i /tmp/w.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume" || true
