name: Archive completed Twitch VODs to Drive
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      vod_id:
        description: 'Optional owned VOD ID (e.g. 2917078189); completion checks still apply'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mrhype420-drive-archive
  cancel-in-progress: false
jobs:
  archive:
    # Remains inactive even after merge until a separate owner activation decision.
    if: github.repository == 'coltonhavens/xbox-twitch-recorder' && github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.XTR_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned recorder dependencies
        run: |
          python -m pip install --no-cache-dir -r recorder/requirements.txt
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - name: Offline verification before secrets are available
        run: python -m unittest discover -s tests -v
      - name: Archive completed full VODs
        env:
          ARCHIVE_ENABLED: 'true'
          XTR_DRIVE_AUTH: ${{ secrets.XTR_DRIVE_AUTH }}
          SELECTED_VOD: ${{ inputs.vod_id }}
        run: |
          if [ -n "$SELECTED_VOD" ]; then
            python -m recorder.worker --vod-id "$SELECTED_VOD"
          else
            python -m recorder.worker
          fi
# No media/credentials artifacts, dependency caches, deployments, IAM, OIDC or write token.
