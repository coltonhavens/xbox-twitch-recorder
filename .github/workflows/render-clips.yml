name: Render daily MrHype420 clips to Drive
# Lives only on the `clipper` branch. The daily Claude run picks the moments and pushes small plan
# files (clipper/plans/<date>/*.json); this job downloads just those stream windows from Twitch,
# renders the vertical clips, and uploads them to Drive with the recorder's existing credential.
on:
  push:
    branches: [clipper]
    paths: ['clipper/plans/**.json']
  workflow_dispatch:
    inputs:
      date:
        description: 'Plan folder to (re)render, e.g. 2026-11-16'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mrhype420-clip-render
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'coltonhavens/xbox-twitch-recorder'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --no-cache-dir -r clipper/requirements.txt
      - name: Find plans to render
        id: plans
        env:
          BEFORE: ${{ github.event.before }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            ls clipper/plans/"$DATE_INPUT"/*.json > plans.txt
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'clipper/plans/' | grep '\.json$' > plans.txt || true
          else
            git show --name-only --pretty=format: "$GITHUB_SHA" -- 'clipper/plans/' | grep '\.json$' > plans.txt || true
          fi
          cat plans.txt
          echo "count=$(grep -c . plans.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Render and upload
        if: steps.plans.outputs.count != '0'
        env:
          XTR_DRIVE_AUTH: ${{ secrets.XTR_DRIVE_AUTH }}
        run: |
          set -e
          for plan in $(cat plans.txt); do
            date=$(basename "$(dirname "$plan")")
            python clipper/render_plan.py "$plan" "out/$date"
          done
          for d in out/*/; do
            date=$(basename "$d")
            python clipper/upload_to_drive.py "$date" "$d"*.mp4
          done
# No artifacts, no write token; the only secret is the existing drive.file credential.
